<!DOCTYPE html>
<html>
<head>
    <title>Edit Student</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
<h1>BMCC STEM Connect</h1>

<a href="/">Students</a> |
<a href="/internships">Internships</a> |
<a href="/applications">Applications</a>

<hr>
<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">BMCC STEM Connect</span>
    </div>
</nav>

<div class="container mt-5">

    <div class="card p-4 shadow-sm">
        <h2>Edit Student</h2>

        <form action="/update/{{ student[0] }}" method="POST">

            <div class="mb-3">
                <label>Name</label>
                <input type="text" name="name" value="{{ student[1] }}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Email</label>
                <input type="email" name="email" value="{{ student[2] }}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Major</label>
                <input type="text" name="major" value="{{ student[3] }}" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-success">Update Student</button>
            <a href="/" class="btn btn-secondary">Back</a>

        </form>
    </div>

</div>

</body>
</html>
