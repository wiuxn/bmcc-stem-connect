<!DOCTYPE html>
<html>
<head>
    <title>Applications</title>
</head>
<body>

<h1>BMCC STEM Connect</h1>

<a href="/">Students</a> |
<a href="/internships">Internships</a> |
<a href="/applications">Applications</a>

<h2>Add Application</h2>

<form action="/add_application" method="POST">
    Student:<br>
    <select name="student_id" required>
        {% for student in students %}
        <option value="{{ student[0] }}">{{ student[1] }}</option>
        {% endfor %}
    </select><br><br>

    Internship:<br>
    <select name="internship_id" required>
        {% for internship in internships %}
        <option value="{{ internship[0] }}">{{ internship[1] }} - {{ internship[2] }}</option>
        {% endfor %}
    </select><br><br>

    Status:<br>
    <input type="text" name="status" placeholder="Applied / Interview / Accepted" required><br><br>

    <button type="submit">Add Application</button>
</form>

<h2>Applications</h2>

<table border="1" cellpadding="8">
    <tr>
        <th>ID</th>
        <th>Student</th>
        <th>Company</th>
        <th>Position</th>
        <th>Status</th>
        <th>Action</th>
    </tr>

    {% for app in applications %}
    <tr>
        <td>{{ app[0] }}</td>
        <td>{{ app[1] }}</td>
        <td>{{ app[2] }}</td>
        <td>{{ app[3] }}</td>
        <td>{{ app[4] }}</td>
        <td>
            <a href="/edit_application/{{ app[0] }}">Edit</a>
|
<a href="/delete_application/{{ app[0] }}">Delete</a>
        </td>
    </tr>
    {% endfor %}
</table>

</body>
</html>
